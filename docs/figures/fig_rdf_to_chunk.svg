<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700">

  <defs>
    <!-- Single arrowhead marker; orient="auto" rotates it to match line direction -->
    <marker id="arr" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="700" fill="white"/>

  <!-- ══════════════════════════════════════════════════════
       FIGURE TITLE
  ═══════════════════════════════════════════════════════ -->
  <text x="600" y="38" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="bold" fill="#1A1A2E">
    Pre-retrieval Transformation: RDF Triples &#x2192; Entity-Centric Chunk
  </text>

  <!-- ══════════════════════════════════════════════════════
       STAGE 1 — Raw RDF Triples  (x=20, w=347)
  ═══════════════════════════════════════════════════════ -->

  <!-- Body -->
  <rect x="20" y="58" width="347" height="452" rx="7"
        fill="#F4F4F8" stroke="#8888AA" stroke-width="1.3"/>
  <!-- Title bar (rounded top, flat bottom via overlay rect) -->
  <rect x="20" y="58" width="347" height="40" rx="7"
        fill="#DCDCE8" stroke="#8888AA" stroke-width="1.3"/>
  <rect x="21" y="85" width="345" height="13" fill="#DCDCE8" stroke="none"/>

  <!-- Title -->
  <text x="193" y="84" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="bold" fill="#1A1A2E">Raw RDF Triples</text>

  <!-- Section label -->
  <text x="45" y="128"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" fill="#666666" font-style="italic">Example triples:</text>

  <!-- Triple 1 -->
  <rect x="35" y="136" width="318" height="28" rx="3"
        fill="#EAEAF5" stroke="#CCCCDD" stroke-width="0.8"/>
  <text x="50" y="155"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2D2060">&#x3C;paper&#x3E; dc:title &#x22;BERT...&#x22;</text>

  <!-- Triple 2 -->
  <rect x="35" y="172" width="318" height="28" rx="3"
        fill="#EAEAF5" stroke="#CCCCDD" stroke-width="0.8"/>
  <text x="50" y="191"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2D2060">&#x3C;paper&#x3E; mlsea:hasTask &#x3C;task&#x3E;</text>

  <!-- Triple 3 -->
  <rect x="35" y="208" width="318" height="28" rx="3"
        fill="#EAEAF5" stroke="#CCCCDD" stroke-width="0.8"/>
  <text x="50" y="227"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2D2060">&#x3C;task&#x3E; rdfs:label &#x22;QA&#x22;</text>

  <!-- Bottom note -->
  <text x="193" y="486" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#666666" font-style="italic">Distributed graph facts</text>

  <!-- ══════════════════════════════════════════════════════
       ARROW 1
  ═══════════════════════════════════════════════════════ -->
  <line x1="370" y1="284" x2="422" y2="284"
        stroke="#444444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════════════
       STAGE 2 — Entity Aggregation  (x=427, w=347)
  ═══════════════════════════════════════════════════════ -->

  <!-- Body -->
  <rect x="427" y="58" width="347" height="452" rx="7"
        fill="#EEF4FB" stroke="#6A9FC0" stroke-width="1.3"/>
  <!-- Title bar -->
  <rect x="427" y="58" width="347" height="40" rx="7"
        fill="#C8DEF0" stroke="#6A9FC0" stroke-width="1.3"/>
  <rect x="428" y="85" width="345" height="13" fill="#C8DEF0" stroke="none"/>

  <!-- Title -->
  <text x="600" y="84" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="bold" fill="#1A1A2E">Entity Aggregation</text>

  <!-- Graph edges (drawn first, behind nodes) -->
  <!-- Paper (600,300) → Title (515,212) -->
  <line x1="600" y1="262" x2="524" y2="224"
        stroke="#6A9FC0" stroke-width="1.5"/>
  <!-- Paper (600,300) → Task label (692,212) -->
  <line x1="600" y1="262" x2="680" y2="224"
        stroke="#6A9FC0" stroke-width="1.5"/>
  <!-- Paper (600,300) → Dataset/Method (600,382) -->
  <line x1="600" y1="338" x2="600" y2="372"
        stroke="#6A9FC0" stroke-width="1.5"/>

  <!-- Central node: Paper -->
  <circle cx="600" cy="300" r="38"
          fill="white" stroke="#4A86B8" stroke-width="2"/>
  <text x="600" y="305" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="bold" fill="#1A1A2E">Paper</text>

  <!-- Satellite node: Title -->
  <rect x="468" y="196" width="94" height="30" rx="5"
        fill="white" stroke="#4A86B8" stroke-width="1.5"/>
  <text x="515" y="216" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#2D2D2D">Title</text>

  <!-- Satellite node: Task label -->
  <rect x="644" y="196" width="94" height="30" rx="5"
        fill="white" stroke="#4A86B8" stroke-width="1.5"/>
  <text x="691" y="216" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#2D2D2D">Task label</text>

  <!-- Satellite node: Dataset / Method -->
  <rect x="532" y="372" width="136" height="30" rx="5"
        fill="white" stroke="#4A86B8" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#2D2D2D">Dataset / Method</text>

  <!-- Bottom notes -->
  <text x="600" y="472" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#666666" font-style="italic">IRIs resolved into readable labels</text>
  <text x="600" y="488" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#666666" font-style="italic">and aggregated per entity</text>

  <!-- ══════════════════════════════════════════════════════
       ARROW 2
  ═══════════════════════════════════════════════════════ -->
  <line x1="777" y1="284" x2="829" y2="284"
        stroke="#444444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════════════
       STAGE 3 — Textual Chunk  (x=834, w=347)
  ═══════════════════════════════════════════════════════ -->

  <!-- Body -->
  <rect x="834" y="58" width="347" height="452" rx="7"
        fill="#EEF8EE" stroke="#6DAB7E" stroke-width="1.3"/>
  <!-- Title bar -->
  <rect x="834" y="58" width="347" height="40" rx="7"
        fill="#C5E8C5" stroke="#6DAB7E" stroke-width="1.3"/>
  <rect x="835" y="85" width="345" height="13" fill="#C5E8C5" stroke="none"/>

  <!-- Title -->
  <text x="1007" y="84" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="bold" fill="#1A1A2E">Textual Chunk</text>

  <!-- Document card -->
  <rect x="858" y="113" width="298" height="308" rx="5"
        fill="white" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Card header strip -->
  <rect x="858" y="113" width="298" height="22" rx="5"
        fill="#DDDDDD" stroke="#AAAAAA" stroke-width="1"/>
  <rect x="858" y="124" width="298" height="11" fill="#DDDDDD" stroke="none"/>
  <!-- Decorative ruled lines in header -->
  <line x1="872" y1="121" x2="912" y2="121" stroke="#BBBBBB" stroke-width="1.5"/>
  <line x1="918" y1="121" x2="958" y2="121" stroke="#BBBBBB" stroke-width="1.5"/>

  <!-- Field: Title -->
  <text x="875" y="158"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="bold" fill="#333333">Title:</text>
  <text x="913" y="158"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#333333">BERT...</text>
  <line x1="868" y1="167" x2="1148" y2="167" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Field: Task -->
  <text x="875" y="189"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="bold" fill="#333333">Task:</text>
  <text x="907" y="189"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#333333">Question Answering</text>
  <line x1="868" y1="198" x2="1148" y2="198" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Field: Dataset -->
  <text x="875" y="220"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="bold" fill="#333333">Dataset:</text>
  <text x="927" y="220"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#333333">SQuAD</text>
  <line x1="868" y1="229" x2="1148" y2="229" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Field: Method -->
  <text x="875" y="251"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="bold" fill="#333333">Method:</text>
  <text x="930" y="251"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#333333">Transformers</text>
  <line x1="868" y1="260" x2="1148" y2="260" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Simulated prose lines (suggest full text body) -->
  <rect x="868" y="272" width="210" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="285" width="248" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="298" width="188" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="311" width="232" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="324" width="196" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="337" width="218" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="350" width="174" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="363" width="240" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="376" width="200" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="389" width="152" height="7" rx="2" fill="#EBEBEB"/>
  <rect x="868" y="402" width="228" height="7" rx="2" fill="#EBEBEB"/>

  <!-- Bottom note -->
  <text x="1007" y="472" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#666666" font-style="italic">Coherent text for dense embedding</text>
  <text x="1007" y="488" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#666666" font-style="italic">and vector indexing</text>

  <!-- ══════════════════════════════════════════════════════
       BOTTOM — Vector index
  ═══════════════════════════════════════════════════════ -->

  <!-- Down arrow from Stage 3 bottom -->
  <line x1="1007" y1="514" x2="1007" y2="565"
        stroke="#444444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- DB cylinder body -->
  <rect x="897" y="570" width="220" height="68" rx="3"
        fill="#F0F0FF" stroke="#888888" stroke-width="1.3"/>
  <!-- Top cap ellipse -->
  <ellipse cx="1007" cy="570" rx="110" ry="13"
           fill="#E0E0F5" stroke="#888888" stroke-width="1.3"/>
  <!-- Bottom ellipse (stroke only, drawn on top of body) -->
  <ellipse cx="1007" cy="638" rx="110" ry="13"
           fill="none" stroke="#888888" stroke-width="1.3"/>

  <!-- Label inside cylinder -->
  <text x="1007" y="601" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" fill="#333333">Embedded &#x26; stored in</text>
  <text x="1007" y="619" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" fill="#333333">vector index</text>

</svg>
